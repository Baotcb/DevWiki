services:
  mongodb:
    image: mongo:7
    container_name: devwiki-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend-network

  devwiki-api:
    image: devwiki-api:${APP_VERSION:-latest}
    container_name: devwiki-api
    restart: always
    networks:
      - backend-network
      - frontend-network
    env_file:
      - ./api.env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin}
    depends_on:
      - mongodb


  devwiki-web:
    image: devwiki-web:${APP_VERSION:-latest}
    container_name: devwiki-web
    networks:
      - frontend-network
    restart: always

  nginx:
    image: nginx:stable-alpine
    container_name: devwiki-nginx
    restart: always
    networks:
      - frontend-network
    depends_on:
      devwiki-api:
        condition: service_started
      devwiki-web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/JenkinsDeployer/docker/ssl:/etc/nginx/ssl:ro
      - /home/JenkinsDeployer/docker/logs/nginx:/var/log/nginx

volumes:
  mongodb_data:
    name: devwiki-mongodb-data

networks:
  backend-network:
    driver: bridge

  frontend-network:
    driver: bridge