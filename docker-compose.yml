services:
  mongodb:
    image: mongo:7
    container_name: devwiki-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend-network
    healthcheck:
      test: >
        mongosh --quiet --username "$${MONGO_USERNAME}" --password "$${MONGO_PASSWORD}"
        --authenticationDatabase admin --eval "db.runCommand({ping:1}).ok" | grep -q '^1$$'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  devwiki-api:
    image: devwiki-api:${APP_VERSION:-latest}
    container_name: devwiki-api
    restart: always
    networks:
      backend-network:
        aliases:
          - devwiki-api.local
      frontend-network:
    env_file:
      - ./api.env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin}
      UPLOAD_DIR: /app/uploads
    volumes:
      - devwiki_uploads:/app/uploads
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3000}/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "autoheal=true"


  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock


  devwiki-web:
    image: devwiki-web:${APP_VERSION:-latest}
    container_name: devwiki-web
    networks:
      - frontend-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  nginx:
    image: nginx:stable-alpine
    container_name: devwiki-nginx
    restart: always
    networks:
      - frontend-network
    depends_on:
      devwiki-api:
        condition: service_started
      devwiki-web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/JenkinsDeployer/docker/ssl:/etc/nginx/ssl:ro
      - /home/JenkinsDeployer/docker/logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongodb_data:
    name: devwiki-mongodb-data
    external: true
  devwiki_uploads:
    name: devwiki-uploads

networks:
  backend-network:
    driver: bridge

  frontend-network:
    driver: bridge